<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VYZCORP | Infrastructure Deployment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-glow: #5bc8d8;
            --cyan-bright: #aef7ff;
            --alert-red: #ff4e4e;
            --bg-overlay: rgba(10, 25, 30, 0.90);
        }

        body {
            margin: 0;
            background: 
                radial-gradient(circle at 50% 90%, rgba(255, 120, 40, 0.08), transparent 50%),
                url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=2072&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Share Tech Mono', monospace;
            color: var(--cyan-glow);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            text-transform: uppercase;
        }

        .terminal-container {
            position: relative;
            width: 100%;
            max-width: 550px;
            margin: 20px;
            padding: 60px 40px 35px 40px;
            background: var(--bg-overlay);
            border: 1px solid rgba(91, 200, 216, 0.4);
            border-radius: 4px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), inset 0 0 30px rgba(91, 200, 216, 0.12);
            backdrop-filter: blur(15px);
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        .terminal-header {
            position: absolute;
            top: 0; 
            left: 50%;
            transform: translateX(-50%);
            background: rgba(6, 15, 20, 0.95);
            padding: 10px 50px;
            border: 1px solid var(--cyan-glow);
            border-top: none;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            letter-spacing: 8px;
            clip-path: polygon(0 0, 100% 0, 85% 100%, 15% 100%);
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
            white-space: nowrap;
        }

        .header-dot {
            width: 7px;
            height: 7px;
            background-color: var(--cyan-bright);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--cyan-bright);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }

        /* Progress Bar Animation */
        .progress-wrapper {
            width: 100%;
            height: 24px;
            border: 1px solid var(--cyan-glow);
            background: rgba(5, 18, 24, 0.7);
            margin: 30px 0;
            position: relative;
            overflow: hidden;
            border-radius: 2px;
        }

        .progress-bar {
            height: 100%;
            background: repeating-linear-gradient(
                45deg,
                var(--cyan-glow),
                var(--cyan-glow) 10px,
                transparent 10px,
                transparent 20px
            );
            background-size: 28px 28px;
            width: 0%;
            animation: loadProgress 4s ease-in-out infinite, moveStripes 1s linear infinite;
            box-shadow: 0 0 15px var(--cyan-glow);
        }

        @keyframes loadProgress {
            0% { width: 5%; }
            50% { width: 95%; }
            100% { width: 5%; }
        }

        @keyframes moveStripes {
            0% { background-position: 0 0; }
            100% { background-position: 28px 0; }
        }

        /* Glitch Animation */
        .corp-name { 
            color: var(--alert-red); 
            font-family: 'Orbitron', sans-serif; 
            font-size: 0.9rem; 
            animation: glitch 4s infinite; 
        }

        @keyframes glitch { 
            0%, 90%, 100% { opacity: 1; transform: skew(0); } 
            92% { opacity: 0.6; transform: skew(6deg); } 
            95% { opacity: 0.8; transform: skew(-6deg); } 
        }

        .terminal-footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
            margin-top: 35px;
            padding-top: 15px;
            border-top: 1px solid rgba(91, 200, 216, 0.15);
            font-size: 0.65rem;
        }
    </style>
</head>
<body>

    <div class="terminal-container">
        <!-- Floating Title Bar -->
        <div class="terminal-header">
            <div class="header-dot"></div>
            <span>VYZCORP</span>
        </div>

        <div class="w-full flex flex-col items-center text-center mt-4">
            <div style="font-family: 'Orbitron', sans-serif; letter-spacing: 3px; font-size: 1.1rem; color: var(--cyan-bright);" class="mb-4">
                SYSTEM UNDER DEVELOPMENT
            </div>
            
            <p class="text-[#aef7ff]/70 tracking-widest text-sm leading-relaxed max-w-[90%]">
                INFRASTRUCTURE DEPLOYMENT IN PROGRESS. 
                AUTOMATED SYSTEMS ARE CURRENTLY PROVISIONING NETWORK RESOURCES AND DATABASE SCHEMAS.
            </p>

            <!-- Animated Progress Bar -->
            <div class="progress-wrapper">
                <div class="progress-bar"></div>
            </div>

            <div class="text-[#5bc8d8] animate-pulse tracking-[0.3em] text-xs mt-2">
                PLEASE STAND BY...
            </div>
        </div>

        <!-- Terminal Footer Info -->
        <div class="terminal-footer">
            <div class="status-indicator text-left">
                <div style="color: var(--cyan-bright); opacity: 0.6; margin-bottom: 3px; letter-spacing: 1px;">CONNECTION ORIGIN: SECURED</div>
                <!-- IP is now safely hardcoded, removing the need for external API fetch -->
                <div style="font-family: 'Share Tech Mono'; letter-spacing: 1px; color: var(--cyan-glow);">IP: 127.0.0.1</div>
            </div>

            <div class="branding-indicator text-right">
                <div style="opacity: 0.6; color: var(--cyan-glow); letter-spacing: 1px; margin-bottom: 3px;">POWERED BY</div>
                <div class="corp-name">VYZCORP INC.</div>
            </div>
        </div>
    </div>

</body>
</html>
